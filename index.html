<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>TOOL THIÊN TRẦN</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0a0a0a; color: #d0d0d0;
    font-family: 'Courier New', monospace; padding: 20px;
    position: relative; overflow-x: hidden;
  }
  #hexbg {
    position: fixed; inset: 0; z-index: 0;
    color: #ff2d55; opacity: 0.06;
    font-size: 11px; line-height: 1.4;
    white-space: pre; overflow: hidden;
    pointer-events: none; user-select: none;
  }
  .wrap { position: relative; z-index: 1; }
  .header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 20px; padding-bottom: 16px;
    border-bottom: 1px solid #2a2a2a;
  }
  .header .gif {
    width: 64px; height: 64px; object-fit: cover;
    border: 1px solid #ff2d55; border-radius: 6px; background: #141414;
  }
  .header .title {
    font-size: 22px; font-weight: bold; color: #ff2d55;
    letter-spacing: 3px; text-transform: uppercase;
  }
  .header .sub { font-size: 11px; color: #555; letter-spacing: 1px; margin-top: 4px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    padding: 10px 20px; background: #141414; border: 1px solid #2a2a2a;
    color: #666; cursor: pointer; font-family: inherit; font-size: 13px;
    transition: all .15s;
  }
  .tab.active { background: #ff2d55; color: #000; border-color: #ff2d55; font-weight: bold; }
  .tab:hover:not(.active) { border-color: #ff2d55; color: #ff2d55; }
  .panel { display: none; }
  .panel.active { display: block; }
  .dropzone {
    border: 2px dashed #2a2a2a; padding: 40px; text-align: center;
    color: #555; cursor: pointer; transition: all .15s; margin-bottom: 16px;
  }
  .dropzone:hover, .dropzone.drag { border-color: #ff2d55; color: #ff2d55; background: #141414; }
  .dropzone input { display: none; }
  .info { background: #141414; padding: 12px; margin-bottom: 16px; border-left: 3px solid #ff2d55; font-size: 12px; }
  .info span { color: #ff2d55; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  button {
    padding: 8px 16px; background: #141414; border: 1px solid #2a2a2a;
    color: #d0d0d0; cursor: pointer; font-family: inherit; font-size: 12px;
    transition: all .15s;
  }
  button:hover { border-color: #ff2d55; color: #ff2d55; }
  button.primary { background: #ff2d55; color: #000; border-color: #ff2d55; font-weight: bold; }
  button.primary:hover { background: #ff4066; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:disabled:hover { border-color: #2a2a2a; color: #d0d0d0; }
  .viewer {
    background: #000; border: 1px solid #2a2a2a; padding: 12px;
    height: 460px; overflow: auto; font-size: 12px; line-height: 1.5;
    white-space: pre; color: #888;
  }
  .viewer .addr { color: #444; user-select: none; }
  .viewer .hex { color: #4af; }
  .viewer .ascii { color: #aaa; }
  .viewer .str { color: #3f3; }
  .log {
    background: #000; border: 1px solid #2a2a2a; padding: 12px;
    height: 200px; overflow: auto; font-size: 12px; color: #888;
    margin-top: 12px;
  }
  .log .ok { color: #3f3; }
  .log .err { color: #ff2d55; }
  .log .warn { color: #fa3; }
  .section-label { margin: 16px 0 8px; color: #ff2d55; font-size: 12px; }

  /* nút vuông nhỏ tab 2 */
  .sq-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .sq-btn {
    width: 140px; height: 140px; padding: 12px;
    background: #141414; border: 1px solid #2a2a2a;
    color: #d0d0d0; cursor: pointer; font-family: inherit;
    font-size: 12px; line-height: 1.3;
    display: flex; align-items: center; justify-content: center;
    text-align: center; transition: all .15s;
  }
  .sq-btn:hover { border-color: #ff2d55; color: #ff2d55; background: #1a0a0f; }
  .sq-btn:disabled { opacity: .35; cursor: not-allowed; }
  .sq-btn:disabled:hover { border-color: #2a2a2a; color: #d0d0d0; background: #141414; }
</style>
</head>
<body>

<div id="hexbg"></div>

<div class="wrap">
  <div class="header">
    <img class="gif" src="https://media.giphy.com/media/3o7TKSjRrfIPjeiVyM/giphy.gif" alt="gif"
         onerror="this.style.display='none'">
    <div>
      <div class="title">TOOL THIÊN TRẦN</div>
      <div class="sub">// vex build // upload · view · inject</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="1">tab 1 // xem code</div>
    <div class="tab" data-tab="2">tab 2 // bơm code</div>
  </div>

  <!-- TAB 1 -->
  <div class="panel active" id="panel-1">
    <div class="dropzone" id="dz1">
      <input type="file" id="file1" accept=".bin,.so,.dll,.exe">
      <div>drop .bin / .so ở đây hoặc click // max 100MB</div>
    </div>
    <div class="info" id="info1" style="display:none"></div>
    <div class="toolbar">
      <button data-view="hex">hex view</button>
      <button data-view="ascii">ascii</button>
      <button data-view="strings">strings</button>
      <button id="dl1" disabled>download raw</button>
    </div>
    <div class="viewer" id="viewer1">// chưa có file. upload đi nerd.</div>
  </div>

  <!-- TAB 2 -->
  <div class="panel" id="panel-2">
    <div class="dropzone" id="dz2">
      <input type="file" id="file2" accept=".bin,.so,.dll,.exe">
      <div>drop file để bơm code // .bin / .so</div>
    </div>
    <div class="info" id="info2" style="display:none"></div>

    <div class="section-label">// chọn kiểu bơm</div>
    <div class="sq-grid">
      <button class="sq-btn" id="inject-belly" disabled>bơm code<br>aim bụng</button>
      <button class="sq-btn" id="inject-neck" disabled>bơm aim<br>neck nhẹ</button>
    </div>

    <div class="toolbar" style="margin-top:16px">
      <button id="dl2" disabled>download file đã chỉnh sửa</button>
    </div>
    <div class="log" id="log2">// log sẽ hiện ở đây</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* nền hex chạy */
(function hexBg() {
  const el = $('hexbg');
  const LINES = 70, COLS = 64, HEX = '0123456789abcdef';
  const randByte = () => HEX[(Math.random()*16)|0] + HEX[(Math.random()*16)|0];
  const makeLine = () => {
    let s = '';
    for (let c = 0; c < COLS; c++) s += randByte() + ' ';
    return s;
  };
  const rows = [];
  for (let i = 0; i < LINES; i++) rows.push(makeLine());
  el.textContent = rows.join('\n');
  setInterval(() => {
    rows.shift();
    rows.push(makeLine());
    el.textContent = rows.join('\n');
  }, 90);
})();

/* tabs */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const p = $('panel-' + t.dataset.tab);
    if (p) p.classList.add('active');
  });
});

const state = { buf1:null, name1:null, buf2:null, name2:null, patched:null };

/* dropzone — fix: input nằm trong dz, click handler phải check đúng */
function wireDrop(dzId, inputId, onFile) {
  const dz = $(dzId), input = $(inputId);
  if (!dz || !input) return;

  // click vào vùng dropzone (trừ khi click chính input) -> mở picker
  dz.addEventListener('click', e => {
    if (e.target === input) return;
    input.click();
  });

  input.addEventListener('change', () => {
    const f = input.files && input.files[0];
    if (f) onFile(f);
    input.value = ''; // reset để chọn lại cùng file vẫn trigger
  });

  let dc = null;
  dz.addEventListener('dragover', e => {
    e.preventDefault(); clearTimeout(dc); dz.classList.add('drag');
  });
  dz.addEventListener('dragleave', () => {
    dc = setTimeout(() => dz.classList.remove('drag'), 60);
  });
  dz.addEventListener('drop', e => {
    e.preventDefault(); clearTimeout(dc); dz.classList.remove('drag');
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) onFile(f);
  });
}

/* tab1 upload */
wireDrop('dz1','file1', async f => {
  if (f.size > 100*1024*1024) return $('viewer1').textContent = 'file > 100MB. sybau.';
  state.buf1 = new Uint8Array(await f.arrayBuffer());
  state.name1 = f.name;
  renderInfo('info1', f, state.buf1);
  renderHex($('viewer1'), state.buf1);
  $('dl1').disabled = false;
});

/* tab2 upload */
wireDrop('dz2','file2', async f => {
  if (f.size > 100*1024*1024) return log('file > 100MB. sybau.','err');
  state.buf2 = new Uint8Array(await f.arrayBuffer());
  state.name2 = f.name;
  state.patched = null;
  renderInfo('info2', f, state.buf2);
  $('inject-belly').disabled = false;
  $('inject-neck').disabled = false;
  $('dl2').disabled = true;
  log('loaded ' + f.name + ' // ' + f.size + ' bytes','ok');
});

function renderInfo(id, f, buf) {
  const el = $(id);
  el.style.display = 'block';
  el.innerHTML = `<span>${f.name}</span> // ${f.size} bytes // magic: <span>${magic(buf)}</span>`;
}
function magic(b) {
  const h = [...b.slice(0,4)].map(x=>x.toString(16).padStart(2,'0')).join(' ');
  if (b[0]===0x7f && b[1]===0x45) return 'ELF ('+h+')';
  if (b[0]===0x4d && b[1]===0x5a) return 'PE/MZ ('+h+')';
  return h;
}

/* tab1 viewers */
document.querySelectorAll('[data-view]').forEach(b => {
  b.addEventListener('click', () => {
    if (!state.buf1) return;
    const v = b.dataset.view;
    if (v === 'hex') renderHex($('viewer1'), state.buf1);
    else if (v === 'ascii') renderAscii($('viewer1'), state.buf1);
    else renderStrings($('viewer1'), state.buf1);
  });
});

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function renderHex(el, buf) {
  const lines = [];
  const max = Math.min(buf.length, 100*1024);
  for (let i = 0; i < max; i += 16) {
    const c = buf.slice(i, i+16);
    const hex = [...c].map(x=>x.toString(16).padStart(2,'0')).join(' ');
    const ascii = [...c].map(x=>x>=32&&x<127?String.fromCharCode(x):'.').join('');
    const addr = i.toString(16).padStart(8,'0');
    lines.push(`<span class="addr">${addr}</span>  <span class="hex">${hex.padEnd(47)}</span>  <span class="ascii">${esc(ascii)}</span>`);
  }
  if (buf.length > max) lines.push(`<span class="warn">... truncated at ${max} (${buf.length} total)</span>`);
  el.innerHTML = lines.join('\n');
}

function renderAscii(el, buf) {
  const max = Math.min(buf.length, 200*1024);
  let out = '';
  for (let i = 0; i < max; i++) {
    const c = buf[i];
    out += (c>=32&&c<127)?String.fromCharCode(c):(c===10?'\n':'·');
  }
  el.textContent = out;
}

function renderStrings(el, buf) {
  const out = []; let cur = '', start = 0;
  for (let i = 0; i < buf.length; i++) {
    const c = buf[i];
    if (c>=32 && c<127) { if (!cur) start = i; cur += String.fromCharCode(c); }
    else { if (cur.length >= 4) out.push({off:start, s:cur}); cur = ''; }
  }
  if (cur.length >= 4) out.push({off:start, s:cur});
  el.innerHTML = out.length
    ? out.map(x=>`<span class="addr">0x${x.off.toString(16).padStart(8,'0')}</span>  <span class="str">${esc(x.s)}</span>`).join('\n')
    : '// không thấy string nào >= 4 ký tự.';
}

$('dl1').addEventListener('click', () => state.buf1 && dl(state.buf1, state.name1));

/* ===== tab2: bơm code ===== */
// placeholder offset/byte — m tự fill khi biết vị trí thật
const PATCH_BELLY = { OFFSET: -1, BYTES: [] };  // aim bụng
const PATCH_NECK  = { OFFSET: -1, BYTES: [] };  // neck nhẹ: bone_Neck -> bone_Head

function doPatch(cfg, label) {
  if (!state.buf2) return log('chưa upload file.','err');
  if (!confirm('chắc chắn bơm ' + label + '?')) return log('hủy bơm ' + label,'warn');

  log('bơm ' + label + '...','warn');
  const out = new Uint8Array(state.buf2); // giữ nguyên dung lượng
  let changed = 0;

  if (cfg.OFFSET >= 0 && cfg.BYTES.length > 0) {
    const o = cfg.OFFSET;
    if (o >= out.length) {
      log('offset ngoài range.','err');
    } else {
      const len = Math.min(cfg.BYTES.length, out.length - o);
      for (let i = 0; i < len; i++) {
        if (out[o+i] !== cfg.BYTES[i]) changed++;
        out[o+i] = cfg.BYTES[i];
      }
      log(`${label} @0x${o.toString(16)} // ${len} bytes // ${changed} diff`,'ok');
    }
  } else {
    log('offset chưa set -> no-op, giữ nguyên file.','warn');
  }

  state.patched = out;
  $('dl2').disabled = false;
  log(`in:  ${state.buf2.length} bytes`,'ok');
  log(`out: ${out.length} bytes`,'ok');
  log(out.length === state.buf2.length ? 'dung lượng giữ nguyên ✔' : 'dung lượng lệch','warn');
}

$('inject-belly').addEventListener('click', () => doPatch(PATCH_BELLY, 'code aim bụng'));
$('inject-neck').addEventListener('click', () => doPatch(PATCH_NECK, 'aim neck nhẹ'));

$('dl2').addEventListener('click', () => {
  if (!state.patched) return log('chưa bơm gì.','err');
  dl(state.patched, state.name2 || 'output.bin'); // giữ nguyên tên gốc
  log('downloaded ' + (state.name2 || 'output.bin') + ' // ' + state.patched.length + ' bytes','ok');
});

/* util */
function log(msg, cls) {
  const el = $('log2');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = '> ' + msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  while (el.childElementCount > 500) el.removeChild(el.firstChild);
}

function dl(buf, name) {
  const blob = new Blob([buf], { type:'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name || 'out.bin';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
</script>
</body>
</html>
